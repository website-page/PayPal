<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolePlus — Seat Verification</title><link rel="stylesheet" href="css/style.css">
</head>
<body><main class="page-shell"><section class="card reveal">
  <div class="brand"><span class="brand-mark">P</span><span>PolePlus</span></div>
  <div class="progress"><i class="active"></i><i class="active"></i><i></i></div>
  <div class="eyebrow">STEP 2 OF 3</div><h1>Verify your seat</h1>
  <p class="muted">Enter the four-digit seat number from your demo student record.</p>
  <form id="seatForm" class="form">
    <label for="seatNumber">Seat number</label>
    <input id="seatNumber" inputmode="numeric" maxlength="4" placeholder="1234" required>
    <p id="message" class="message" role="alert"></p>
    <button type="submit">Verify <span>→</span></button>
  </form>
</section></main><script src="js/app.js"></script></body></html>
