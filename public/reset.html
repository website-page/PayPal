<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolePlus — Favourite Food</title><link rel="stylesheet" href="css/style.css">
</head>
<body><main class="page-shell"><section class="card reveal">
  <div class="brand"><span class="brand-mark">P</span><span>PolePlus</span></div>
  <div class="progress"><i class="active"></i><i class="active"></i><i class="active"></i></div>
  <div class="eyebrow">STEP 3 OF 3</div><h1>Reset favourite food</h1>
  <p class="muted">Choose a new favourite food for this fictional school-project record.</p>
  <form id="foodForm" class="form">
    <label for="food">Favourite food</label><input id="food" type="text" placeholder="Jollof rice" required>
    <label for="confirmFood">Confirm favourite food</label><input id="confirmFood" type="text" placeholder="Jollof rice" required>
    <p id="message" class="message" role="alert"></p>
    <button type="submit">Reset food <span>→</span></button>
  </form>
</section></main><script src="js/app.js"></script></body></html>
